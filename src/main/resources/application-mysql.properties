# Only used when the app runs with the "mysql" profile.
spring.datasource.url=jdbc:mysql://localhost:3306/risk
spring.datasource.username=risk
spring.datasource.password=risk

# Lets Hibernate create the table for us while we develop.
# A real production system would use migrations (for example Flyway) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false